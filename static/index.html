<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Items demo</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    form  { margin-bottom: 1rem; }
    input { padding: .3rem .5rem; }
    button{ padding: .3rem .8rem; }
    ul    { list-style: none; padding: 0; }
    li    { padding: .2rem 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Items</h1>

  <form id="addForm">
    <input id="nameInput" placeholder="New item name" required />
    <button type="submit">Add</button>
  </form>

  <ul id="itemsList"></ul>

  <script>
    const api = '/items';
    const listEl = document.getElementById('itemsList');
    const formEl = document.getElementById('addForm');
    const nameEl = document.getElementById('nameInput');

    // Fetch and render the current list
    async function loadItems() {
      listEl.innerHTML = 'Loading…';
      try {
        const res  = await fetch(api);
        const data = await res.json();
        listEl.innerHTML = '';
        data.forEach(it => {
          const li = document.createElement('li');
          li.textContent = `${it.id}: ${it.name}`;
          listEl.appendChild(li);
        });
      } catch (err) {
        listEl.innerHTML = `<li style="color:red">Failed: ${err}</li>`;
      }
    }

    // Handle form submission
    formEl.addEventListener('submit', async e => {
      e.preventDefault();
      const name = nameEl.value.trim();
      if (!name) return;
      try {
        await fetch(api, {
          method : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body   : JSON.stringify({ name })
        });
        nameEl.value = '';
        loadItems();
      } catch (err) {
        alert('Failed to add: ' + err);
      }
    });

    // Initial load
    loadItems();
  </script>
</body>
</html>
